services:
  postgres:
    image: postgres:16-alpine
    container_name: linkops-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linkops
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linkops-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: myservice:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: linkscale-api
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${PORT:-3000}:3000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      APP_VERSION: ${IMAGE_TAG:-latest}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/linkops}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided by platform secrets}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://linkscale.example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
